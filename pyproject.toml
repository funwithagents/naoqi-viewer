[project]
name = "naoqi-viewer"
version = "0.1.0"
description = "MuJoCo viewer for NAO: mirrors any NAOqi robot or renders naoqi-sim's simulated world, with the NAO model and a license-gated mesh fetcher."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco>=3.15.0",
    "numpy>=2.5.3",
    "platformdirs>=4.12.4",
    "pyyaml>=6.0.3",
    "qi>=3.1.8,<4",
]

[project.scripts]
naoqi-viewer = "naoqi_viewer.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# libqi Python 3 wheels come from the funwithagents fork's package index on GitHub Pages, not PyPI
# (PyPI's `qi` is Aldebaran's older 3.1.5). The fork builds them for macOS arm64, Linux x86_64 and
# Windows x64 only.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "libqi"
url = "https://funwithagents.github.io/libqi-python/simple/"
explicit = true  # only the packages pinned to it below come from it

[tool.uv.sources]
qi = { index = "libqi" }

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python
# ruff formats Python blocks inside Markdown too: the specs' and plans' blocks are hand-aligned.
extend-exclude = ["specs", "plans"]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
